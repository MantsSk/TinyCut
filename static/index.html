<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyCutOpus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&family=Permanent+Marker&family=Poppins:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✂</span> TinyCutOpus</div>
  <input id="projectName" class="project-name" spellcheck="false" title="Project name">
  <div class="spacer"></div>
  <button id="undoBtn" class="icon-btn" title="Undo (⌘Z)">↶</button>
  <button id="redoBtn" class="icon-btn" title="Redo (⇧⌘Z)">↷</button>
  <button id="exportBtn" class="primary">Export</button>
</header>

<main class="workspace">
  <aside class="left panel">
    <nav class="tabs">
      <button data-tab="media" class="active">Media</button>
      <button data-tab="captions">Captions</button>
    </nav>
    <section id="tab-media" class="tab-body"></section>
    <section id="tab-captions" class="tab-body hidden"></section>
  </aside>

  <section class="center">
    <div class="stage" id="stage">
      <canvas id="preview"></canvas>
    </div>
    <div class="transport">
      <span id="timeNow" class="time">00:00.00</span>
      <button id="playBtn" class="play" title="Play / pause (Space)">▶</button>
      <span id="timeTotal" class="time dim">00:00.00</span>
    </div>
  </section>

  <aside class="right panel" id="inspector"></aside>
</main>

<section class="timeline-wrap">
  <div class="tl-toolbar">
    <button id="splitBtn" title="Split at playhead (S)">✂ Split</button>
    <button id="deleteBtn" title="Delete selection (⌫)">🗑 Delete</button>
    <button id="addTrackBtn" title="Add an overlay track">＋ Track</button>
    <button id="addTextBtn" title="Add a text caption at the playhead (T)">＋ Text</button>
    <label class="chk"><input type="checkbox" id="snapChk" checked> Snap</label>
    <div class="spacer"></div>
    <span class="dim small" id="tlHint">Drag clips to rearrange · drag edges to trim · ⌘/Ctrl + scroll to zoom</span>
    <button id="zoomOut" class="icon-btn" title="Zoom out (-)">−</button>
    <input type="range" id="zoom" min="0" max="100" value="45">
    <button id="zoomIn" class="icon-btn" title="Zoom in (+)">＋</button>
    <button id="zoomFit" title="Fit timeline">Fit</button>
  </div>
  <div class="timeline" id="timeline"></div>
</section>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
