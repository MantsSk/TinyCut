# Builds the TinyCutOpus desktop app on macOS, Windows and Linux, smoke-tests each packaged app,
# and (for version tags like v1.0.0) publishes the installers to a GitHub Release.
name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            app: dist/TinyCutOpus.app/Contents/MacOS/TinyCutOpus
          - name: Windows (x64)
            os: windows-2022
            app: dist/TinyCutOpus/TinyCutOpus.exe
          - name: Linux (x86_64)
            os: ubuntu-22.04  # oldest supported glibc → AppImage runs on newer distros too
            app: dist/TinyCutOpus-*.AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake xvfb libfuse2 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libgl1 libnss3 libasound2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libdbus-1-3

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Cache bundled ffmpeg / whisper.cpp
        uses: actions/cache@v4
        with:
          path: vendor/bin
          key: vendor-${{ runner.os }}-${{ hashFiles('desktop/build.py') }}

      - name: Build
        run: python desktop/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: TinyCutOpus-${{ runner.os }}
          path: |
            dist/TinyCutOpus-*.dmg
            dist/TinyCutOpus-*.exe
            dist/TinyCutOpus-*.zip
            dist/TinyCutOpus-*.AppImage
          if-no-files-found: error

      - name: Smoke test the packaged app
        shell: bash
        env:
          TINYCUT_SELFTEST: ${{ github.workspace }}/desktop/smoketest.py
          SMOKE_RESULT: ${{ runner.temp }}/smoke.json
          TINYCUT_DATA: ${{ runner.temp }}/tinycut-data
          TINYCUT_EXPORTS: ${{ runner.temp }}/tinycut-exports
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          app=$(ls ${{ matrix.app }} | head -1)
          if [ "$RUNNER_OS" = Linux ]; then chmod +x "$app"; xvfb-run -a "$app"; else "$app"; fi || true
          python - <<'EOF'
          import json, os, sys
          r = json.load(open(os.environ["SMOKE_RESULT"], encoding="utf-8"))
          print("\n".join(r["log"]))
          sys.exit(0 if r["ok"] else 1)
          EOF

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
